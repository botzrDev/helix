[workspace]
resolver = "2"
members = [
    "crates/helix-caps",
    "crates/helix-policy",
    "crates/helix-runtime",
    "crates/helix-gateway",
    "crates/helix-audit",
    "crates/helix-sdk",
    "crates/helix-sdk-macro",
    "crates/helix-sdk-wit",
    "crates/helix-ctl",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/botzrDev/helix"
rust-version = "1.86"
version = "0.1.0"
publish = false

[workspace.dependencies]
wasmtime = "36.0"
wasmtime-wasi = "36.0"
wasmtime-wasi-io = "36.0"
wasmtime-wasi-http = { version = "36.0", default-features = false }
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
bytes = "1"
anyhow = "1"
wit-bindgen = "0.44"
tokio = "1"
axum = "0.8"
cap-std = "3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
serde_json = "1.0.151"
proptest = "1.11.0"
toml = "0.8.23"
base64 = "0.22.1"
log = "0.4.27"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
minicbor = { version = "0.25", default-features = true, features = ["std"] }
sha2 = "0.10"
metrics = "0.24"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
url = "2"
httpdate = "1"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs", "use_pem"] }
schemars = { version = "1.2", features = ["derive"] }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
trybuild = "1.0"

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
