[workspace]
resolver = "2"
members = [
    "crates/helix-caps",
    "crates/helix-policy",
    "crates/helix-runtime",
    "crates/helix-gateway",
    "crates/helix-audit",
    "crates/helix-sdk",
    "crates/helix-ctl",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/botzrDev/helix"
rust-version = "1.86"
version = "0.1.0"
publish = false

[workspace.dependencies]
wasmtime = "36.0"
wasmtime-wasi = "36.0"
wit-bindgen = "0.44"
tokio = "1"
axum = "0.8"
cap-std = "3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
serde_json = "1.0.151"
proptest = "1.11.0"
toml = "0.8.23"
base64 = "0.22.1"
log = "0.4.27"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
minicbor = { version = "0.25", default-features = true, features = ["std"] }
sha2 = "0.10"
metrics = "0.24"

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
