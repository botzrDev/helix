[package]
name = "helix-benches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Criterion microbenchmarks BENCH-1..3 (HLX-40 / M7-01)"

[dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
helix-caps = { path = "../crates/helix-caps" }
helix-gateway = { path = "../crates/helix-gateway" }
helix-runtime = { path = "../crates/helix-runtime" }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
wasmtime = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "bench1_subset"
harness = false
path = "bench1_subset.rs"

[[bench]]
name = "bench2_auth"
harness = false
path = "bench2_auth.rs"

[[bench]]
name = "bench3_invoke"
harness = false
path = "bench3_invoke.rs"
