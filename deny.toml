[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive via wasmtime → fxprof-processed-profile → fxhash. No safe upgrade;
# tracked upstream in wasmtime. Ignore until wasmtime drops fxhash (HLX-24).
ignore = [
    "RUSTSEC-2025-0057",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
